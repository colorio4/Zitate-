<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zitate">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1916">
<link rel="apple-touch-icon" href="icon.png">
<title>Weise Zitate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe6; --ink: #2a2622; --muted: #8a8078; --accent: #a8553a; --card: #fbf8f2; --line: #e2d9ca;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1916; --ink: #ece5d8; --muted: #9a9086; --accent: #d98462; --card: #23201c; --line: #35302a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px 20px; gap: 28px;
  }
  .card {
    width: 100%; max-width: 640px; background: var(--card);
    border: 1px solid var(--line); border-radius: 18px;
    padding: 44px 32px 32px; position: relative; text-align: center;
  }
  .mark {
    font-family: 'Cormorant Garamond', Georgia, serif; font-size: 90px; line-height: .6;
    color: var(--accent); height: 40px; display: block; margin-bottom: 8px;
  }
  .quote {
    font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500;
    font-size: clamp(26px, 5.6vw, 38px); line-height: 1.3; margin: 0 0 22px;
    transition: opacity .35s ease, transform .35s ease; min-height: 3.9em;
    display: flex; align-items: center; justify-content: center;
  }
  .author { color: var(--muted); font-size: 15px; letter-spacing: .04em; transition: opacity .35s ease; margin: 0; }
  .fade .quote, .fade .author { opacity: 0; }
  .fade .quote { transform: translateY(6px); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-size: 15px; cursor: pointer; color: var(--ink);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 18px; transition: background .15s, border-color .15s;
  }
  button:hover { border-color: var(--accent); }
  .chip { padding: 7px 16px; font-size: 14px; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 12px 26px; }
  button.primary:hover { filter: brightness(1.08); }
  button.fav.on { color: var(--accent); border-color: var(--accent); }
  .actions { margin-top: 30px; }
  .hint { color: var(--muted); font-size: 12.5px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .favs { width: 100%; max-width: 640px; }
  .favs h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; font-weight: 600; margin: 0 0 10px; }
  .favs ul { list-style: none; margin: 0; padding: 0; }
  .favs li { padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.45; cursor: pointer; }
  .favs li span { color: var(--muted); display: block; font-size: 13px; margin-top: 2px; }

  .label { color: var(--accent); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 14px; visibility: hidden; }
  .search { width: 100%; max-width: 640px; }
  input[type=search], textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none;
  }
  input[type=search]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 64px; margin: 14px 0 10px; }
  .results { list-style: none; margin: 8px 0 0; padding: 0; }
  .results li { padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.45; cursor: pointer; }
  .results li span { color: var(--muted); display: block; font-size: 13px; margin-top: 2px; }
  .favs .tools { margin-top: 18px; }
  .favs .tools p { color: var(--muted); font-size: 13px; margin: 0 0 4px; }
</style>
</head>
<body>
  <div class="row" id="chips">
    <button class="chip" data-f="daily">Heute</button>
    <button class="chip on" data-f="all">Alle</button>
    <button class="chip" data-f="s">Stoa</button>
    <button class="chip" data-f="z">Zen</button>
    <button class="chip" data-f="m">Mut</button>
    <button class="chip" data-f="g">Gelassenheit</button>
    <button class="chip" data-f="k">Kreativität</button>
  </div>
  <main class="card" id="card">
    <span class="mark" aria-hidden="true">“</span>
    <p class="label" id="label">Zitat des Tages</p>
    <p class="quote" id="text" aria-live="polite"></p>
    <p class="author" id="author"></p>
    <div class="actions row">
      <button class="primary" id="next">Nächstes Zitat</button>
      <button id="fav" class="fav" aria-pressed="false">♡ Merken</button>
      <button id="copy">Kopieren</button>
      <button id="share">Teilen</button>
    </div>
  </main>
  <section class="search">
    <input type="search" id="q" placeholder="Suchen: Stichwort oder Autor" autocomplete="off">
    <ul class="results" id="results"></ul>
  </section>
  <section class="favs" id="favs">
    <h2>Deine Favoriten</h2>
    <ul id="favList"></ul>
    <div class="tools">
      <p>Favoriten auf ein anderes Gerät übertragen: Code kopieren, dort einfügen und übernehmen.</p>
      <textarea id="code" placeholder="Code hier einfügen" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      <div class="row" style="justify-content:flex-start">
        <button id="copyCode">Meinen Code kopieren</button>
        <button id="applyCode">Code übernehmen</button>
      </div>
    </div>
  </section>
  <div class="toast" id="toast"></div>

<script>
const QUOTES = [
  ["Ich weiß, dass ich nichts weiß.", "Sokrates"],
  ["Das Leben ist kurz, die Kunst ist lang.", "Hippokrates"],
  ["Es ist nicht wenig Zeit, die wir haben, sondern viel, die wir nicht nutzen.", "Seneca"],
  ["Wer nicht weiß, in welchen Hafen er segeln will, für den ist kein Wind der richtige.", "Seneca"],
  ["Nicht weil es schwer ist, wagen wir es nicht – weil wir es nicht wagen, ist es schwer.", "Seneca"],
  ["Das Glück deines Lebens hängt von der Beschaffenheit deiner Gedanken ab.", "Marc Aurel"],
  ["Der Weg von tausend Meilen beginnt mit dem ersten Schritt.", "Laozi"],
  ["Wer andere kennt, ist klug; wer sich selbst kennt, ist weise.", "Laozi"],
  ["Wer ein Warum zu leben hat, erträgt fast jedes Wie.", "Friedrich Nietzsche"],
  ["Habe Mut, dich deines eigenen Verstandes zu bedienen.", "Immanuel Kant"],
  ["Man muss das Unmögliche versuchen, um das Mögliche zu erreichen.", "Hermann Hesse"],
  ["Phantasie ist wichtiger als Wissen, denn Wissen ist begrenzt.", "Albert Einstein"],
  ["Wer fragt, ist für fünf Minuten dumm. Wer nicht fragt, bleibt es ein Leben lang.", "Chinesisches Sprichwort"],
  ["Eile mit Weile.", "Augustus"],
  ["Glück ist das Einzige, was sich verdoppelt, wenn man es teilt.", "Albert Schweitzer"],
  ["Erkenne dich selbst.", "Inschrift im Apollotempel von Delphi"],
  ["Was man nicht versteht, besitzt man nicht.", "Johann Wolfgang von Goethe"],
  ["Wer weiß, dass ihm genug ist, der ist reich.", "Laozi"],
  ["Nichts tun – und doch bleibt nichts ungetan.", "Laozi"],

  // Stoa
  ["Nicht die Dinge selbst beunruhigen die Menschen, sondern die Meinungen über die Dinge.", "Epiktet"],
  ["Manches steht in unserer Macht, anderes nicht.", "Epiktet"],
  ["Verlange nicht, dass geschieht, was du willst. Wolle, was geschieht, und es wird dir gut gehen.", "Epiktet"],
  ["Sage dir zuerst, wer du sein willst. Dann tue, was du dafür tun musst.", "Epiktet"],
  ["Kein großes Ding entsteht plötzlich.", "Epiktet"],
  ["Wir haben zwei Ohren und einen Mund, damit wir doppelt so viel hören wie sprechen.", "Epiktet (zugeschrieben)"],
  ["Wir leiden öfter in der Vorstellung als in der Wirklichkeit.", "Seneca"],
  ["Das Leben ist lang genug, wenn man es zu nutzen weiß.", "Seneca"],
  ["Man lernt sein Leben lang – und, was noch erstaunlicher ist, man lernt sein Leben lang zu leben.", "Seneca"],
  ["Arm ist nicht, wer wenig hat, sondern wer viel begehrt.", "Seneca"],
  ["Beginne sofort zu leben und zähle jeden Tag als ein eigenes Leben.", "Seneca"],
  ["Wie der Körper durch Arbeit, so wird der Geist durch Mühen gestärkt.", "Seneca"],
  ["Unglücklich nenne ich den, dem nie etwas Widriges begegnet ist.", "Seneca"],
  ["Zorn ist eine kurze Raserei.", "Horaz"],
  ["Das Hindernis auf dem Weg wird zum Weg.", "Marc Aurel"],
  ["Lebe nicht, als hättest du noch zehntausend Jahre.", "Marc Aurel"],
  ["Verschwende keine Zeit mehr damit zu diskutieren, was ein guter Mensch sein soll. Sei einer.", "Marc Aurel"],
  ["Die beste Rache ist, nicht so zu werden wie der, der dir Unrecht tat.", "Marc Aurel"],
  ["Wenn dich etwas Äußeres schmerzt, stört dich nicht die Sache, sondern dein Urteil darüber.", "Marc Aurel"],
  ["Was dem Schwarm nicht nützt, nützt auch der Biene nicht.", "Marc Aurel"],
  ["Unser Leben ist das, wozu unser Denken es macht.", "Marc Aurel"],

  // Zen
  ["Den Weg zu lernen heißt, sich selbst zu lernen. Sich selbst zu lernen heißt, sich selbst zu vergessen.", "Dōgen", "z"],
  ["Der große Weg ist nicht schwer für den, der nicht wählt.", "Sengcan", "z"],
  ["Nicht wissen ist das Allernächste.", "Dizang", "z"],
  ["Ein Tag ohne Arbeit ist ein Tag ohne Essen.", "Baizhang", "z"],
  ["Wenn du sitzt, dann sitze. Wenn du gehst, dann gehe. Vor allem: Zögere nicht.", "Ummon", "z"],
  ["Vor der Erleuchtung: Holz hacken, Wasser tragen. Nach der Erleuchtung: Holz hacken, Wasser tragen.", "Zen-Weisheit", "z"],
  ["Der Finger, der zum Mond zeigt, ist nicht der Mond.", "Zen-Weisheit", "z"],
  ["Eine volle Tasse kann nichts mehr aufnehmen.", "Zen-Geschichte vom Tee", "z"],
  ["Sieben Mal fallen, acht Mal aufstehen.", "Japanisches Sprichwort", "z"],
  ["Sitze still und tue nichts: Der Frühling kommt, und das Gras wächst von selbst.", "Zenrin Kushū", "z"],
  ["Jeder Tag ist eine Reise, und die Reise selbst ist das Zuhause.", "Matsuo Bashō", "z"],
  ["Alter Teich – ein Frosch springt hinein, das Geräusch des Wassers.", "Matsuo Bashō", "z"],
  ["Der Dieb ließ es zurück: den Mond am Fenster.", "Ryōkan", "z"],
  ["Der Schnee schmilzt, und das ganze Dorf ist voller Kinder.", "Kobayashi Issa", "z"],

  // Mut
  ["Die Feigen sterben viele Tode vor ihrem Tod, der Tapfere kostet den Tod nur einmal.", "William Shakespeare", "a", "m"],
  ["Dem Mutigen hilft das Glück.", "Vergil", "a", "m"],
  ["Wer andere besiegt, ist stark. Wer sich selbst besiegt, ist mächtig.", "Laozi", "a", "m"],

  // Gelassenheit
  ["Nichts ist genug für den, dem genug zu wenig ist.", "Epikur", "a", "g"],
  ["Bewahre in schwierigen Zeiten einen gleichmütigen Sinn.", "Horaz", "s", "g"],
  ["Nutze den Tag und vertraue dem nächsten so wenig wie möglich.", "Horaz", "s", "g"],
  ["Nirgends lebt ein Mensch ruhiger und ungestörter als in seiner eigenen Seele.", "Marc Aurel", "s", "g"],

  // Kreativität
  ["Die Kunst ist eine Vermittlerin des Unaussprechlichen.", "Johann Wolfgang von Goethe", "a", "k"],
  ["Der Mensch spielt nur, wo er in voller Bedeutung des Wortes Mensch ist.", "Friedrich Schiller", "a", "k"],
  ["Kunst gibt nicht das Sichtbare wieder, sie macht sichtbar.", "Paul Klee", "a", "k"],
  ["Man muss noch Chaos in sich haben, um einen tanzenden Stern gebären zu können.", "Friedrich Nietzsche", "a", "k"],
  ["Folge nicht den Spuren der Alten, suche, was sie suchten.", "Matsuo Bashō (zugeschrieben)", "z", "k"]
];
// Themen für ältere Zitate (Anfang des Textes -> Thema)
const TH = {
  'Man muss das U': 'm', 'Habe Mut, dich': 'm', 'Nicht weil es s': 'm', 'Wer ein Warum z': 'm',
  'Das Hindernis ': 'm', 'Sieben Mal fal': 'm',
  'Wir leiden öft': 'g', 'Nicht die Dinge': 'g', 'Verlange nicht,': 'g', 'Zorn ist eine ': 'g',
  'Manches steht ': 'g', 'Wer weiß, dass ': 'g', 'Eile mit Weile': 'g',
  'Phantasie ist ': 'k', 'Alter Teich – ': 'k', 'Jeder Tag ist e': 'k'
};
const themeOf = q => q[3] || (Object.keys(TH).find(k => q[0].startsWith(k)) ? TH[Object.keys(TH).find(k => q[0].startsWith(k))] : '');
const STOA = ['Seneca', 'Marc Aurel', 'Epiktet', 'Epiktet (zugeschrieben)', 'Horaz'];
const catOf = q => q[2] || (STOA.includes(q[1]) ? 's' : 'a');
let filter = 'all';

const $ = id => document.getElementById(id);
const card = $('card');

function store(key, def) { try { return JSON.parse(localStorage.getItem(key) || def); } catch (e) { return JSON.parse(def); } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

let favs = store('fav', '[]');
let seen = store('seen', '[]');
let order = [], pos = -1, hist = [], hp = -1, current = 0;

// Zitat des Tages: pro Kalendertag (lokale Zeit) fest, für alle Geräte gleich
const dayNum = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
const daily = (Math.imul(dayNum, 2654435761) >>> 0) % QUOTES.length;

function inFilter(i) {
  const q = QUOTES[i];
  return filter === 'all' || catOf(q) === filter || themeOf(q) === filter;
}

// Gemischte Reihenfolge; bereits gesehene Zitate (auch von früheren Besuchen) kommen zuletzt
function shuffle() {
  const pool = QUOTES.map((_, i) => i).filter(inFilter);
  let fresh = pool.filter(i => !seen.includes(i));
  if (!fresh.length) {
    seen = seen.filter(i => !pool.includes(i));
    save('seen', seen);
    fresh = pool.filter(i => i !== current);
    if (!fresh.length) fresh = pool;
  }
  for (let i = fresh.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [fresh[i], fresh[j]] = [fresh[j], fresh[i]];
  }
  order = fresh; pos = -1;
}
function markSeen(i) { if (!seen.includes(i)) { seen.push(i); save('seen', seen); } }

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function render(i) {
  current = i;
  $('label').style.visibility = i === daily ? 'visible' : 'hidden';
  $('text').textContent = QUOTES[i][0];
  $('author').textContent = '— ' + QUOTES[i][1];
  const on = favs.includes(i);
  const b = $('fav');
  b.classList.toggle('on', on);
  b.setAttribute('aria-pressed', on);
  b.textContent = on ? '♥ Gemerkt' : '♡ Merken';
}
function show(i) {
  card.classList.add('fade');
  setTimeout(() => { render(i); card.classList.remove('fade'); }, 300);
}
function go(i) {
  hist = hist.slice(0, hp + 1); hist.push(i); hp = hist.length - 1;
  markSeen(i); show(i);
}
function newQuote() {
  pos++;
  if (pos >= order.length) { shuffle(); pos = 0; }
  go(order[pos]);
}
function next() {
  if (hp < hist.length - 1) { hp++; show(hist[hp]); } else newQuote();
}
function prev() {
  if (hp > 0) { hp--; show(hist[hp]); }
}

function renderFavs() {
  const ul = $('favList'); ul.innerHTML = '';
  favs.forEach(i => {
    const li = document.createElement('li');
    li.textContent = QUOTES[i][0];
    const s = document.createElement('span'); s.textContent = QUOTES[i][1];
    li.appendChild(s);
    li.onclick = () => { go(i); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    ul.appendChild(li);
  });
}

$('next').onclick = next;
$('fav').onclick = () => {
  favs = favs.includes(current) ? favs.filter(x => x !== current) : [...favs, current];
  save('fav', favs); render(current); renderFavs();
};
const quoteText = () => `„${QUOTES[current][0]}“ — ${QUOTES[current][1]}`;
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(quoteText()); toast('Kopiert'); } catch (e) { toast('Kopieren nicht möglich'); }
};
$('share').onclick = async () => {
  if (navigator.share) {
    try { await navigator.share({ text: quoteText() }); } catch (e) {}
  } else {
    try { await navigator.clipboard.writeText(quoteText()); toast('Kopiert'); } catch (e) { toast('Teilen nicht möglich'); }
  }
};

// Favoriten übertragen
$('copyCode').onclick = async () => {
  const c = 'ZF1:' + favs.join('.');
  $('code').value = c;
  try { await navigator.clipboard.writeText(c); toast('Code kopiert'); }
  catch (e) { $('code').select(); toast('Code markieren und kopieren'); }
};
$('applyCode').onclick = () => {
  const m = $('code').value.trim().match(/^ZF1:([\d.]*)$/);
  if (!m) { toast('Code nicht erkannt'); return; }
  const ids = m[1].split('.').filter(Boolean).map(Number).filter(n => Number.isInteger(n) && n < QUOTES.length);
  favs = [...new Set([...favs, ...ids])];
  save('fav', favs); renderFavs(); render(current);
  toast(ids.length + ' Favoriten übernommen');
};

// Suche
$('q').oninput = () => {
  const t = $('q').value.trim().toLowerCase();
  const ul = $('results'); ul.innerHTML = '';
  if (t.length < 2) return;
  const hits = QUOTES.map((_, i) => i).filter(i => (QUOTES[i][0] + ' ' + QUOTES[i][1]).toLowerCase().includes(t)).slice(0, 20);
  if (!hits.length) { const li = document.createElement('li'); li.textContent = 'Nichts gefunden'; ul.appendChild(li); return; }
  hits.forEach(i => {
    const li = document.createElement('li');
    li.textContent = QUOTES[i][0];
    const s = document.createElement('span'); s.textContent = QUOTES[i][1];
    li.appendChild(s);
    li.onclick = () => { go(i); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    ul.appendChild(li);
  });
};

// Wischen und Tastatur
let tx = null, ty = null;
card.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
card.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  tx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { dx < 0 ? next() : prev(); }
}, { passive: true });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space' || e.code === 'ArrowRight') { e.preventDefault(); next(); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); prev(); }
});

// Filter
document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  if (c.dataset.f === 'daily') { go(daily); return; }
  filter = c.dataset.f;
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
  shuffle(); newQuote();
});

// Start: Zitat des Tages
hist = [daily]; hp = 0;
markSeen(daily);
current = daily;
shuffle();
render(daily);
renderFavs();
</script>
</body>
</html>
